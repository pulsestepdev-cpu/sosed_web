server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # изоляция страницы — без неё многопоточная сборка не запустится (SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # сжатие: готовые .gz из образа, остальное — на лету
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/javascript text/css text/plain;

    # движок Godot — WebAssembly
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
    # страница и ресурсы игры — всегда сверять версию (после обновления друзья сразу получают новую)
    location ~* \.(html|pck|js)$ {
        add_header Cache-Control "no-cache";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
